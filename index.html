
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Calculator</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Marks Calculator</h1>
        <p>Enter your marks out of 100.</p>

        <form id="marksForm">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName"
                   placeholder="Enter your name" required>

            <label for="subject1">Subject 1</label>
            <input type="number" id="subject1"
                   placeholder="Enter marks" min="0" max="100" required>

            <label for="subject2">Subject 2</label>
            <input type="number" id="subject2"
                   placeholder="Enter marks" min="0" max="100" required>

            <label for="subject3">Subject 3</label>
            <input type="number" id="subject3"
                   placeholder="Enter marks" min="0" max="100" required>

            <button type="submit">Calculate Result</button>
        </form>

        <div id="result" aria-live="polite"></div>
    </div>

    <!-- Connect JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
